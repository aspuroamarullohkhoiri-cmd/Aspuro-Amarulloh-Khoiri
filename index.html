/* Dokumen aman: file di repo berupa ciphertext AES-256-GCM, didekripsi di browser setelah kode akses benar */
(()=>{const box=$('#dokumen');box.innerHTML=`<div class="sec-in">${head('dokumen','Dokumen pendukung','Ijazah, sertifikat, dan pengalaman kerja. Dilindungi kode akses.')}<div id="dk"></div></div>`;
const dk=$('#dk'),TE=new TextEncoder();let M,pw='',G=0,I=0,U={},bad=0;
const wipe=()=>{Object.values(U).forEach(URL.revokeObjectURL);U={};pw='';G=I=0};
async function dec(f){if(U[f])return U[f];const b=new Uint8Array(await(await fetch('dokumen/'+f)).arrayBuffer());
const km=await crypto.subtle.importKey('raw',TE.encode(pw),'PBKDF2',false,['deriveKey']);
const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b.slice(0,16),iterations:M.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
const o=await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(16,28)},k,b.slice(28));return U[f]=URL.createObjectURL(new Blob([o],{type:'image/jpeg'}))}
function lock(msg=''){wipe();dk.innerHTML=`<form class="dk-lock tile" id="dkf">${ico('shield','indigo','lg')}<p>Dokumen ini bersifat pribadi. Hubungi saya untuk mendapatkan kode akses, lalu masukkan di sini.</p><div class="dk-r"><input id="dkp" type="password" autocomplete="off" placeholder="Kode akses" aria-label="Kode akses" required><button class="btn" type="submit">Buka dokumen</button></div><small id="dke" role="alert">${msg}</small></form>`;
$('#dkf').onsubmit=async e=>{e.preventDefault();const b=$('#dkf button'),m=$('#dke');b.disabled=true;m.textContent='Memeriksa…';pw=$('#dkp').value;
try{M=M||await(await fetch('dokumen/manifest.json')).json();await dec(M.groups[0].items[0].f);bad=0;show()}
catch(x){pw='';bad++;m.textContent=x instanceof TypeError?'Dokumen tidak dapat dimuat.':'Kode akses salah.';await new Promise(r=>setTimeout(r,Math.min(bad*1200,6000)));b.disabled=false}}}
function show(){const g=M.groups[G],it=g.items[I],n=g.items.length;
dk.innerHTML=`<div class="dk-tabs" role="tablist">${M.groups.map((x,i)=>`<button class="dk-tab" role="tab" aria-selected="${i===G}" data-g="${i}">${esc(x.g)}<i>${x.items.length}</i></button>`).join('')}<button class="dk-tab dk-out" id="dkx">Kunci kembali</button></div>
<div class="dk-st tile"><button class="dk-nav" data-s="-1" aria-label="Sebelumnya">‹</button><figure><img id="dki" alt="${esc(it.n)}" draggable="false"><figcaption>${esc(it.n)} · ${I+1} dari ${n}</figcaption></figure><button class="dk-nav" data-s="1" aria-label="Berikutnya">›</button></div>
<div class="dk-act"><a class="btn" id="dkd" download="${it.n.replace(/[^\w]+/g,'_')}.jpg" href="#">Unduh gambar ini</a></div>`;
dec(it.f).then(u=>{const im=$('#dki');if(im){im.src=u;$('#dkd').href=u}});const nx=g.items[(I+1)%n];dec(nx.f).catch(()=>{});
$$('.dk-tab[data-g]').forEach(b=>b.onclick=()=>{G=+b.dataset.g;I=0;show()});$('#dkx').onclick=()=>lock();
$$('.dk-nav').forEach(b=>b.onclick=()=>{I=(I+ +b.dataset.s+n)%n;show()})}
box.addEventListener('keydown',e=>{if(!M||!pw||!$('#dki'))return;const n=M.groups[G].items.length;if(e.key==='ArrowRight'){I=(I+1)%n;show()}else if(e.key==='ArrowLeft'){I=(I-1+n)%n;show()}});
let tx=0;box.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});box.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(pw&&$('#dki')&&Math.abs(d)>60){const n=M.groups[G].items.length;I=(I+(d<0?1:-1)+n)%n;show()}});
addEventListener('pagehide',wipe);lock()})();
$('#ft').innerHTML=`<span>© 2026 ${esc(FULL)}</span><span>Revisi ${esc(D.rev)}</span><span class="cr">Belajar Sampai Mati, Sekolah Sampai Tingkat Tertinggi.</span>`;

try{new QRCode($('#qr'),{text:location.href.split('#')[0],width:92,height:92,colorDark:'#0F2420',colorLight:'#ffffff'})}catch(e){const q=$('#qw');q&&(q.hidden=true)}

/* ===== Latar pemandangan, ganti tiap 10 detik ===== */
const BG=[
{n:'Gunung Bromo, Jawa Timur',f:'Mount Bromo at sunrise, showing its volcanoes and Mount Semeru (background).jpg',g:'linear-gradient(170deg,#f8c27a,#c0739a 52%,#2a3b63)'},
{n:'Candi Borobudur, Jawa Tengah',f:'Borobudur-Temple-Park Indonesia Stupas-of-Borobudur-08.jpg',g:'linear-gradient(170deg,#ffd9a0,#e08a6b 50%,#35516b)'},
{n:'Sawah terasering Tegallalang, Bali',f:'1 Tegalalang rice terrace ubud bali.jpg',g:'linear-gradient(170deg,#d9f2a6,#5fb36b 55%,#14503f)'},
{n:'Wayag, Raja Ampat, Papua',f:'The great atolls of Wayag.jpg',g:'linear-gradient(170deg,#9bf0e4,#1fa7b8 55%,#0b4a6e)'},
{n:'Danau Toba, Sumatera Utara',f:'Lake Toba.jpg',g:'linear-gradient(170deg,#bfe3ff,#4f8fc0 55%,#1d4565)'}];
const FP=f=>'https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(f.replace(/ /g,'_'));
const tryImg=u=>new Promise(r=>{const im=new Image();im.onload=()=>r(u);im.onerror=()=>r(null);im.src=u});
const pr=b=>b.p||(b.p=(async()=>{b.u=await tryImg(FP(b.f)+'?width=1600')||await tryImg(FP(b.f));b.done=1})());
const bgi=b=>(b.u?`url("${b.u}"),`:'')+b.g;
const L=$$('#bg i'),cap=$('#cap'),bgp=$('#bgp');let bi=-1,lk=0,bp=RM,capT;
const next=()=>{const any=BG.some(b=>b.u);let n=bi,k=0;do{n=(n+1)%BG.length;k++}while(any&&BG[n].done&&!BG[n].u&&k<BG.length);return n};
const show=n=>{bi=n;const b=BG[n];lk^=1;const l=L[lk];l.style.backgroundImage=bgi(b);l.classList.add('on');L[lk^1].classList.remove('on');
  cap.innerHTML=svg('pin')+`<span>${esc(b.n)}</span>`;cap.classList.add('show');clearTimeout(capT);capT=setTimeout(()=>cap.classList.remove('show'),4500);
  pr(b).then(()=>{if(bi===n)l.style.backgroundImage=bgi(b)})};
const setBp=()=>{bgp.innerHTML=svg(bp?'play':'pause');const t=bp?'Putar pergantian latar':'Jeda pergantian latar';bgp.setAttribute('aria-label',t);bgp.title=t};
bgp.addEventListener('click',()=>{bp=!bp;setBp()});setBp();
show(0);addEventListener('load',()=>BG.forEach(pr));
(function tick(){setTimeout(()=>{if(!bp&&!document.hidden)show(next());tick()},10000)})();

/* ===== Slideshow skill ===== */
const ssEl=$('#ss'),sls=$$('.sl',ssEl),dts=$$('.dots button',ssEl),sh=$('#sh');let cur=0;
const go=(n,d=1)=>{n=(n+NS)%NS;if(n===cur)return;const o=sls[cur];o.style.setProperty('--dx',-d*28+'px');o.classList.remove('on');o.setAttribute('aria-hidden','true');dts[cur].classList.remove('on');dts[cur].removeAttribute('aria-current');
  cur=n;const s=sls[n];s.style.setProperty('--dx',d*28+'px');s.classList.add('on');s.removeAttribute('aria-hidden');dts[n].classList.add('on');dts[n].setAttribute('aria-current','true');$('#sn').textContent=`${n+1} / ${NS}`};
dts.forEach((b,i)=>{b.addEventListener('click',()=>go(i,i>cur?1:-1));b.firstChild.addEventListener('animationend',()=>go(cur+1))});
$('#sp').addEventListener('click',()=>go(cur-1,-1));$('#sx').addEventListener('click',()=>go(cur+1));
const setSh=()=>{const h=ssEl.classList.contains('hold');sh.innerHTML=svg(h?'play':'pause');const t=h?'Putar slideshow':'Jeda slideshow';sh.setAttribute('aria-label',t);sh.title=t};
if(RM)ssEl.classList.add('hold');setSh();
sh.addEventListener('click',()=>{ssEl.classList.toggle('hold');setSh()});
ssEl.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(cur-1,-1);if(e.key==='ArrowRight')go(cur+1)});
let sx0=null;ssEl.addEventListener('touchstart',e=>{sx0=e.touches[0].clientX},{passive:true});
ssEl.addEventListener('touchend',e=>{if(sx0===null)return;const dx=e.changedTouches[0].clientX-sx0;sx0=null;if(Math.abs(dx)>40)go(cur+(dx<0?1:-1),dx<0?1:-1)},{passive:true});

/* ===== ERP interaktif: filter, pencarian, detail modul ===== */
const mods=$('#mods'),cn=$('#cn'),none=$('#none');let fg='all',fq='';
const apply=()=>{let n=0;$$('li',mods).forEach(li=>{const ok=(fg==='all'||li.dataset.g===fg)&&(!fq||li.dataset.t.includes(fq));li.hidden=!ok;if(ok){const b=li.firstChild;b.classList.remove('pop');void b.offsetWidth;b.style.setProperty('--i',n);b.classList.add('pop');n++}});
  cn.textContent=n?`Menampilkan ${n} dari ${MODS.length} modul`:'';none.hidden=n>0;if(!n)none.textContent=`Tidak ada modul yang cocok${fq?` dengan “${fq}”`:''}. Hapus kata kunci atau pilih kategori Semua.`};
apply();
$$('.tab').forEach(t=>t.addEventListener('click',()=>{fg=t.dataset.g;$$('.tab').forEach(x=>x.setAttribute('aria-pressed',x===t));apply()}));
$('#fq').addEventListener('input',e=>{fq=e.target.value.trim().toLowerCase();apply()});
const dlg=$('#dlg');let dl=MODS,di=0,opener=null;
const draw=a=>{const m=dl[di];dlg.innerHTML=`<div class="dlg glass"><div class="dtop">${ico(m.i,m.h,'lg')}<div><span class="mg" style="${hv(m.h)}"><i></i>${esc(m.g)}</span><h3 id="dt">${esc(m.n)}</h3></div><button class="ib" type="button" data-a="x" aria-label="Tutup">${svg('x')}</button></div><p class="dd">${esc(m.d)}</p><div class="dnav"><span>${dl===MODS?'Modul':'Aplikasi'} ${di+1} dari ${dl.length}</span><span><button class="ib" type="button" data-a="p" aria-label="Sebelumnya">${svg('prev')}</button><button class="ib" type="button" data-a="n" aria-label="Berikutnya">${svg('next')}</button></span></div></div>`;if(a){const f=$(`[data-a="${a}"]`,dlg);f&&f.focus()}};
const step=a=>{di=(di+(a==='n'?1:-1)+dl.length)%dl.length;draw(a)};
$('#erp').addEventListener('click',e=>{const b=e.target.closest('.mod');if(!b)return;dl=b.dataset.k==='m'?MODS:AUX;di=+b.dataset.i;opener=b;draw();dlg.showModal()});
dlg.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(e.target===dlg||(b&&b.dataset.a==='x'))dlg.close();else if(b)step(b.dataset.a)});
dlg.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')step('p');if(e.key==='ArrowRight')step('n')});
dlg.addEventListener('close',()=>{opener&&opener.focus()});

/* ===== Efek muncul saat scroll: zoom in + tulisan muncul + angka naik ===== */
const count=el=>{const n=+el.dataset.n;if(RM)return;let t0;const f=t=>{t0??=t;const p=Math.min((t-t0)/1100,1);el.textContent=Math.round(n*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)};
const io='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;e.target.classList.add('in');$$('.cn',e.target).forEach(count);io.unobserve(e.target)}),{threshold:.12,rootMargin:'0px 0px -6% 0px'}):null;
$$('.rv,.tx').forEach(el=>io?io.observe(el):el.classList.add('in'));

/* ===== Perilaku umum ===== */
const root=document.documentElement,nav=$('#nav'),mn=$('#mn'),pg=$('#pg');
$('#tt').addEventListener('click',()=>{const t=root.getAttribute('data-theme')==='dark'?'light':'dark';root.setAttribute('data-theme',t);try{localStorage.setItem('tema',t)}catch(e){}});
const setMenu=o=>{nav.classList.toggle('open',o);mn.setAttribute('aria-expanded',o);mn.setAttribute('aria-label',o?'Tutup menu':'Buka menu')};
mn.addEventListener('click',()=>setMenu(!nav.classList.contains('open')));
nav.addEventListener('click',e=>{if(e.target.closest('a'))setMenu(false)});
addEventListener('keydown',e=>{if(e.key==='Escape')setMenu(false)});
const sc=()=>{const h=root.scrollHeight-innerHeight;pg.style.transform=`scaleX(${h>0?Math.min(scrollY/h,1):0})`};
addEventListener('scroll',sc,{passive:true});sc();
addEventListener('pointermove',e=>{const g=e.target.closest&&e.target.closest('.glass');if(g){const r=g.getBoundingClientRect();g.style.setProperty('--mx',e.clientX-r.left+'px');g.style.setProperty('--my',e.clientY-r.top+'px')}},{passive:true});
const links=$$('a',nav);
const spy=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;links.forEach(a=>{if(a.getAttribute('href')==='#'+e.target.id)a.setAttribute('aria-current','true');else a.removeAttribute('aria-current')})}),{rootMargin:'-40% 0px -55% 0px'});
$$('main>section.sec').forEach(s=>spy.observe(s));
</script>
